<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用量监视器 · 凭据设置原型 v2(PROTOTYPE)</title>
<!--
  PROTOTYPE — 用完即弃,非产品代码。
  问题:「凭据设置界面原型」— 凭据设置界面长什么样、入口在哪?
  三个变体为三种不同结构:
    A = 内嵌表单页(popover 内整页表单,三家平铺)
    B = 独立设置窗口(系统设置风格:侧栏 + 详情)
    C = 分步配置向导(流程:横幅入口 → 一家一步 → 完成页;⚙ = 状态管理)
  切换布局直接落进各自设置面,便于对比;‹ 返回主界面看入口载体。
  已定锚点:凭据 app 自管 → Keychain;每家单行字段;失效可重存;支持清除;secret 不落日志。
  所有字段内容为假示例,勿粘贴真实凭据。
-->
<style>
  :root{
    --stage1:#a8c0dd; --stage2:#e4e9f0;
    --panel:#f4f4f5; --card:#ffffff; --card2:#fafafa;
    --text:#1c1c1e; --sub:#6e6e73; --hair:rgba(0,0,0,.07);
    --blue:#0a84ff; --green:#30d158; --red:#ff453a;
    --shadow:0 22px 60px rgba(0,0,0,.28), 0 4px 14px rgba(0,0,0,.12);
    --errbg:#ffe9e7; --errtx:#c0392b; --okbg:#e7f6ea; --oktx:#1e7d34;
  }
  html.theme-dark{
    --stage1:#1c1e22; --stage2:#2a2d33;
    --panel:#2b2b2e; --card:#3a3a3d; --card2:#353538;
    --text:#f5f5f7; --sub:#98989d; --hair:rgba(255,255,255,.09);
    --shadow:0 22px 60px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.35);
    --errbg:#4a2626; --errtx:#ff8a80; --okbg:#203d26; --oktx:#6edb8a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    background:linear-gradient(160deg,var(--stage1),var(--stage2));min-height:100vh;color:var(--text)}
  .stage{position:relative;min-height:100vh;padding-bottom:170px;overflow:hidden}
  .menubar{position:sticky;top:0;z-index:30;height:30px;display:flex;align-items:center;padding:0 14px;
    background:linear-gradient(rgba(30,30,34,.82),rgba(30,30,34,.72));
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font-size:12.5px;
    user-select:none;box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .menubar .left{display:flex;align-items:center;gap:16px;font-weight:600}
  .menubar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .mbicon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    border-radius:6px;background:rgba(255,255,255,.14);font-size:9px;font-weight:700;color:#30d158}
  .stage-note{position:absolute;left:14px;top:46px;max-width:250px;font-size:10.5px;line-height:1.6;
    color:var(--sub);background:color-mix(in srgb,var(--card) 74%,transparent);
    border:1px solid var(--hair);border-radius:10px;padding:8px 10px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .stage-note b{color:var(--text)}
  .stage-note .warn{color:var(--red)}
  .anchor{position:absolute;top:38px;right:calc(50% - 205px);z-index:20}
  .popover{width:410px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);
    overflow:hidden;position:relative;border:1px solid var(--hair)}
  .arrow{position:absolute;top:-6px;left:calc(50% - 7px);width:14px;height:14px;
    background:var(--panel);transform:rotate(45deg);border-radius:3px;
    border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
  .pop-head{display:flex;align-items:center;gap:8px;padding:11px 13px 7px;user-select:none}
  .pop-head .t{font-weight:700;font-size:14px}
  .pop-head .sp{flex:1}
  .ibtn{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--sub);background:transparent;border:none;cursor:pointer;font-family:inherit}
  .ibtn:hover{background:var(--hair)}
  .pop-foot{display:flex;align-items:center;gap:6px;padding:7px 13px;font-size:10.5px;color:var(--sub);
    border-top:1px solid var(--hair);user-select:none}
  .pop-foot .sp{flex:1}
  .note-ln{font-size:10px;color:var(--sub);padding:2px 0 6px;user-select:none}
  /* 主界面载体(示意) */
  .pending-banner{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--blue) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--blue) 40%,transparent);border-radius:11px;
    padding:8px 11px;margin-bottom:8px;font-size:11.5px;cursor:pointer;user-select:none}
  .pending-banner b{color:var(--text)}
  .pending-banner .go{margin-left:auto;font-size:10.5px;color:var(--blue);font-weight:600}
  .mcard{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--hair);
    border-radius:11px;padding:9px 11px;margin-bottom:7px}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.ok{background:var(--green)} .dot.bad{background:var(--red)} .dot.miss{background:var(--track, rgba(120,120,128,.4))}
  .mcard .nm{font-weight:600;font-size:12.5px;flex:1;min-width:0}
  .mcard .st-txt{font-size:11px;color:var(--sub);white-space:nowrap}
  .mcard .st-txt.bad{color:var(--red)}
  .mini-btn{font-size:11px;padding:3px 11px;border-radius:7px;border:1px solid var(--hair);
    background:var(--card2);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
  .mini-btn:hover{filter:brightness(1.04)}
  .mini-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  /* 通用小件 */
  .banner{font-size:11px;padding:6px 12px;margin:0 0 8px;display:flex;gap:7px;align-items:center;border-radius:9px}
  .banner.arrive{background:color-mix(in srgb,var(--blue) 13%,transparent);color:var(--text)}
  .banner.err{background:var(--errbg);color:var(--errtx)}
  .banner .sp{flex:1}
  .caps{font-size:9.5px;padding:1.5px 7px;border-radius:20px;border:1px solid var(--hair);
    color:var(--sub);background:var(--card2);white-space:nowrap}
  .caps.ok{color:var(--oktx);background:var(--okbg);border-color:transparent}
  .caps.bad{color:var(--errtx);background:var(--errbg);border-color:transparent}
  .inp{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--hair);
    border-radius:8px;padding:0 10px;height:31px}
  .inp input{border:none;background:transparent;outline:none;color:var(--text);font-size:12px;width:100%;
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .inp .lock{font-size:11px;opacity:.55}
  .eye{font-size:11.5px;cursor:pointer;color:var(--sub);border:none;background:none;font-family:inherit;white-space:nowrap}
  .hint{font-size:10px;color:var(--sub);line-height:1.5}
  .hint b{color:var(--text);font-weight:500}
  .btn{font-size:11.5px;padding:4px 13px;border-radius:8px;border:none;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.plain{background:var(--card2);color:var(--text);border:1px solid var(--hair)}
  .btn.danger{background:transparent;color:var(--red);border:none;font-size:11px;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.4;cursor:default}
  .confirm{display:flex;align-items:center;gap:7px;background:var(--errbg);border-radius:8px;
    padding:5px 9px;font-size:10.5px;color:var(--errtx)}
  .saved-ln{font-size:10.5px;color:var(--oktx);display:flex;align-items:center;gap:4px}
  /* A:分组表单页 */
  .grp{background:var(--card);border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-bottom:9px}
  .sec{padding:9px 13px;border-bottom:1px solid var(--hair)}
  .sec:last-child{border-bottom:none}
  .sec-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .sec-row .nm{font-weight:600;font-size:12.5px}
  .sec-row .sp{flex:1}
  .sec-row .fld-lbl{font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.03em;margin-right:2px}
  .acts{display:flex;align-items:center;gap:7px;margin-top:8px}
  .acts .sp{flex:1}
  /* B:独立窗口 */
  .win{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:25;width:500px;
    background:var(--panel);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--hair);
    overflow:hidden;display:none;flex-direction:column}
  .win-bar{display:flex;align-items:center;gap:8px;padding:10px 13px 8px;user-select:none}
  .lights{display:flex;gap:7px}
  .lights i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .lights .r{background:#ff5f57;cursor:pointer} .lights .y{background:#febc2e} .lights .g{background:#28c840}
  .win-bar .ttl{font-size:12.5px;font-weight:600;margin-left:4px}
  .win-body{display:flex;flex:1;min-height:300px}
  .win-side{width:138px;border-right:1px solid var(--hair);padding:7px;flex:0 0 auto}
  .side-item{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:6px 8px;border-radius:7px;
    cursor:pointer;color:var(--sub);user-select:none}
  .side-item.on{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--text);font-weight:600}
  .win-pane{flex:1;padding:10px 15px 12px;overflow:auto}
  .pane-cap{font-size:10px;color:var(--sub);letter-spacing:.06em;margin:2px 0 10px;font-weight:600}
  .wfield .lbl{font-size:11px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .wfield .inp{height:33px;font-size:12.5px}
  .win-foot{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:10px;color:var(--sub);
    border-top:1px solid var(--hair);user-select:none}
  .win-foot .sp{flex:1}
  /* C:向导 */
  .steps{display:flex;align-items:center;gap:6px;padding:0 13px 10px;user-select:none}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
  .step .ring{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;border:1.5px solid var(--track, rgba(120,120,128,.45));color:var(--sub)}
  .step.cur .ring{border-color:var(--blue);color:var(--blue)}
  .step.done .ring{background:var(--green);border-color:var(--green);color:#fff}
  .step .sl{font-size:9px;color:var(--sub)}
  .step.cur .sl{color:var(--blue);font-weight:600}
  .wz-body{padding:4px 15px 12px}
  .wz-title{font-size:13px;font-weight:700;margin-bottom:2px}
  .wz-sub{font-size:10.5px;color:var(--sub);margin-bottom:10px}
  .wz-field .lbl{font-size:11px;font-weight:600;margin-bottom:5px;display:flex;gap:6px;align-items:center}
  .wz-field .inp{height:36px}
  .wz-field .inp input{font-size:12.5px}
  .wz-acts{display:flex;gap:8px;margin-top:14px;align-items:center}
  .wz-acts .sp{flex:1}
  .wz-big{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0 14px;text-align:center}
  .wz-big .ck{width:52px;height:52px;border-radius:50%;background:var(--okbg);color:var(--oktx);
    display:flex;align-items:center;justify-content:center;font-size:26px}
  .wz-big .tt{font-size:14px;font-weight:700}
  .wz-big .st{font-size:11px;color:var(--sub);line-height:1.6}
  /* C:状态管理页 */
  .mrow{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--hair)}
  .mrow:last-child{border-bottom:none}
  .mrow .nm{font-weight:600;font-size:12.5px;flex:1;min-width:0}
  .mrow .st-txt{font-size:11px;color:var(--sub);white-space:nowrap}
  .mrow .st-txt.bad{color:var(--red)}
  .mrow .sp{width:6px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:99;
    background:rgba(24,24,28,.94);color:#fff;font-size:12px;padding:8px 14px;border-radius:9px;
    border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;max-width:70vw}
  /* 控制条 */
  .ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;width:min(940px,96vw);
    background:rgba(24,24,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:9px 12px;display:flex;
    justify-content:center;gap:8px;flex-wrap:wrap;box-shadow:0 8px 30px rgba(0,0,0,.35);user-select:none}
  .ctrl .tag{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#000;background:#ffd60a;
    padding:2px 6px;border-radius:4px}
  .ctrl .g{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
  .ctrl .g .gl{font-size:10px;color:rgba(255,255,255,.55);padding:0 6px;white-space:nowrap}
  .chip{border:none;background:transparent;color:rgba(255,255,255,.85);font-size:11px;padding:3.5px 9px;
    border-radius:7px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .chip:hover{background:rgba(255,255,255,.1)}
  .chip.on{background:var(--blue);color:#fff;font-weight:600}
  .navbtn{width:26px;height:24px;border-radius:7px;border:none;background:rgba(255,255,255,.1);color:#fff;
    cursor:pointer;font-size:12px}
  .navbtn:hover{background:rgba(255,255,255,.2)}
  .vlabel{font-size:11.5px;color:#fff;min-width:118px;text-align:center}
</style>
</head>
<body>
<div class="stage">
  <div class="menubar">
    <div class="left"><span style="font-size:14px">&#63743;</span><span>用量监视器</span></div>
    <div class="right">
      <span class="mbicon">64%</span><span style="opacity:.85">Wi‑Fi</span>
      <span style="opacity:.85">🔋 82%</span><span style="opacity:.85">9:41</span>
    </div>
  </div>

  <div class="stage-note">
    <b>v2 说明</b> — 三个布局 = 三种<b>不同结构</b>:<br>
    A = popover 内<b>整页表单</b>(三家平铺)<br>
    B = <b>独立窗口</b>(侧栏+详情)<br>
    C = <b>分步向导</b>(横幅入口→一家一步→完成页)<br>
    加载即停在设置面;‹ 返回主界面看入口载体。<br>
    <span class="warn">内容均为假示例,勿粘贴真实凭据。</span>
  </div>

  <div class="anchor" id="popAnchor"><div class="popover" id="popover"></div></div>
  <div class="win" id="win"></div>
</div>

<div class="ctrl">
  <span class="tag">PROTOTYPE</span>
  <span class="g"><span class="gl">布局</span><button class="navbtn" data-nav="-1">‹</button>
    <span class="vlabel" id="vlabel"></span><button class="navbtn" data-nav="1">›</button></span>
  <span class="g"><span class="gl">场景</span><span id="sceneGroup"></span></span>
  <span class="g"><span class="gl">写入模拟</span><span id="failGroup"></span></span>
  <span class="g"><span class="gl">外观</span><span id="themeGroup"></span></span>
</div>
<div id="toast"></div>

<script>
/* ===== 常量与状态 ===== */
var FAKE  = { glm:'sk-glm-示例密钥勿填', kimi:'kimi-示例token勿填', ds:'sk-示例密钥勿填' };
var NAMES = { glm:'GLM Coding Plan', kimi:'Kimi for Coding', ds:'DeepSeek' };
var SHORT = { glm:'GLM', kimi:'Kimi', ds:'DeepSeek' };
var ORD   = ['glm','kimi','ds'];
var HINT  = { glm:'粘贴 API key(裸 key,无 Bearer 前缀)',
              kimi:'粘贴访问 token(整段)', ds:'粘贴 API key(sk- 开头)' };
var PLACE = { glm:'sk-…', kimi:'粘贴 Kimi for Coding token…', ds:'sk-…' };
var VARIANTS = [['A','内嵌表单页'],['B','独立窗口'],['C','分步向导']];
var SCENES = [['fresh','全新未配置'],['partial','部分配置+Kimi 失效'],['full','全部已配置']];
var S = {
  variant:(new URLSearchParams(location.search).get('variant')||'A').toUpperCase(),
  scene:'partial', theme:'light', simFail:false,
  view:'auto',     // main | auto(由变体决定落点)
  focus:null,      // A/B 设置面当前 provider; C 向导当前 provider
  wizDone:false, fromErr:false, lastErr:null,
  prov:{}, reveal:{}, clearing:null, savedTick:{},
};
function initProv(sc){
  var p={};
  ORD.forEach(function(k){
    if(sc==='fresh')     p[k]={st:'missing',val:''};
    else if(sc==='full') p[k]={st:'ok',val:FAKE[k]};
    else                 p[k] = (k==='kimi')?{st:'invalid',val:FAKE[k]}:{st:'ok',val:FAKE[k]};
  });
  return p;
}
function mask(){ return '••••••••••••••••'; }
function pendingList(){  // 失效优先,再未配置
  return ORD.filter(function(k){ return S.prov[k].st==='invalid'; })
            .concat(ORD.filter(function(k){ return S.prov[k].st==='missing'; }));
}
function firstPending(){ var p=pendingList(); return p.length? p[0] : null; }
function capsOf(k){
  var st=S.prov[k].st;
  return st==='ok' ? '<span class="caps ok">已配置</span>'
       : st==='invalid' ? '<span class="caps bad">已失效 · 重存即覆盖</span>'
       : '<span class="caps">未配置</span>';
}
function stTxt(k){ var st=S.prov[k].st; return st==='ok'?'已配置':(st==='invalid'?'凭据失效':'未配置'); }

/* ===== 主界面(入口载体,示意) ===== */
function mainHTML(){
  var pend=pendingList().length;
  var banner = (pend>0 && S.variant==='C')
    ? '<div class="pending-banner" data-act="start-wiz">'+pend+' 家凭据待配置<b>('+
      pend+' 家)'+'</b><span class="go">开始配置 →</span></div>'
    : '';
  var rows = ORD.map(function(k){
    var ok = S.prov[k].st==='ok';
    var dotC = ok?'ok':(S.prov[k].st==='invalid'?'bad':'miss');
    var act;
    if (ok) act='<button class="mini-btn" data-act="manage-'+k+'">⚙︎ 管理</button>';
    else act='<button class="mini-btn primary" data-act="goto-'+k+'">去设置</button>';
    return '<div class="mcard"><span class="dot '+dotC+'"></span><span class="nm">'+NAMES[k]+'</span>'+
      '<span class="st-txt'+(ok?'':' bad')+'">'+stTxt(k)+'</span>'+act+'</div>';
  }).join('');
  return '<div class="pop-head"><span class="t">用量监视器</span><span class="sp"></span>'+
    '<button class="ibtn" data-act="gear" title="设置">⚙︎</button></div>'+
    '<div style="padding:2px 13px 10px">'+
    '<div class="note-ln">主界面示意(总览+焦点见 UI 原型票);此处看凭据状态与入口:</div>'+
    banner+rows+'</div>'+
    '<div class="pop-foot">上次更新 09:41 · 30 分钟轮询<span class="sp"></span></div>';
}

/* ===== A:内嵌表单页(整页、三家平铺) ===== */
function secA(k){
  var pr=S.prov[k];
  var saved = S.savedTick[k]?'<span class="saved-ln">✓ 已保存到钥匙串</span>':'';
  var clearUI = S.clearing===k
    ? '<span class="confirm">清除后该 provider 无法拉取。<button class="btn primary" data-act="cfm-clear-'+k+'">清除</button>'+
      '<button class="btn plain" data-act="cancel-clear">取消</button></span>'
    : '<button class="btn danger" data-act="clear-'+k+'"'+(pr.st==='missing'?' disabled':'')+'>清除凭据</button>';
  return '<div class="sec"><div class="sec-row"><span class="nm">'+NAMES[k]+'</span><span class="sp"></span>'+capsOf(k)+'</div>'+
    '<div class="inp"><span class="lock">🔒</span>'+
    '<input type="text" readonly value="'+(S.reveal[k]? pr.val : (pr.val? mask():''))+'" placeholder="'+PLACE[k]+'">'+
    '<button class="eye" data-act="reveal-'+k+'">'+(S.reveal[k]?'隐藏':'显示')+'</button></div>'+
    '<div class="hint" style="margin-top:5px">'+HINT[k]+'。<b>保存时自动去除首尾空白</b>。</div>'+
    '<div class="acts"><button class="btn primary" data-act="save-'+k+'">保存到钥匙串</button>'+
    '<span class="sp"></span>'+saved+clearUI+'</div></div>';
}
function settingsA(){
  var ban = S.fromErr ? '<div class="banner arrive">正在为 <b>'+NAMES[S.focus]+'</b> 更新凭据(来自失效提示)</div>'
          : (S.lastErr ? '<div class="banner err">无法写入钥匙串(错误码 -34018)。请重试。</div>' : '');
  return '<div class="pop-head"><button class="ibtn" data-act="back">‹</button>'+
    '<span class="t">设置 · 凭据</span><span class="sp"></span></div>'+
    '<div style="padding:2px 13px 0">'+ban+'</div>'+
    '<div style="padding:8px 13px 10px">'+
    '<div class="grp">'+ORD.map(secA).join('')+'</div>'+
    '<div class="note-ln">凭据与 pi 无关,由本 app 自管;值仅写入系统钥匙串、进程内使用,不上传。</div></div>'+
    '<div class="pop-foot">钥匙串 · AfterFirstUnlock<span class="sp"></span></div>';
}

/* ===== B:独立窗口 ===== */
function winHTML(){
  var k=S.focus||'glm', pr=S.prov[k];
  var saved = S.savedTick[k]?'<span class="saved-ln" style="margin:0 0 8px">✓ 已保存到钥匙串</span>':'';
  var err = S.lastErr?'<div class="banner err">无法写入钥匙串(错误码 -34018)。请重试。</div>':'';
  var clearUI = S.clearing===k
    ? '<span class="confirm" style="margin:6px 0">清除后该 provider 无法拉取。<button class="btn primary" data-act="cfm-clear-'+k+'">清除</button>'+
      '<button class="btn plain" data-act="cancel-clear">取消</button></span>'
    : '<button class="btn danger" data-act="clear-'+k+'"'+(pr.st==='missing'?' disabled':'')+'>清除凭据…</button>';
  return '<div class="win-bar"><span class="lights"><i class="r" data-act="back"></i><i class="y"></i><i class="g"></i></span>'+
    '<span class="ttl">用量监视器设置</span></div>'+
    '<div class="win-body"><div class="win-side">'+
    ORD.map(function(x){
      var dotC=S.prov[x].st==='ok'?'ok':(S.prov[x].st==='invalid'?'bad':'miss');
      return '<div class="side-item'+(x===k?' on':'')+'" data-act="focus-'+x+'">'+
        '<span class="dot '+dotC+'"></span>'+SHORT[x]+'</div>';
    }).join('')+'</div>'+
    '<div class="win-pane"><div class="pane-cap">'+NAMES[k]+' · 凭据</div>'+
    (S.fromErr?'<div class="banner arrive" style="margin:0 0 8px">正在为 <b>'+NAMES[k]+'</b> 更新凭据(来自失效提示)</div>':'')+err+saved+
    '<div class="wfield"><div class="lbl">访问凭据'+capsOf(k)+'</div>'+
    '<div class="inp"><span class="lock">🔒</span>'+
    '<input type="text" readonly value="'+(S.reveal[k]? pr.val : (pr.val? mask():''))+'" placeholder="'+PLACE[k]+'">'+
    '<button class="eye" data-act="reveal-'+k+'">'+(S.reveal[k]?'隐藏':'显示')+'</button></div>'+
    '<div class="hint" style="margin-top:6px">'+HINT[k]+'。保存时自动去除首尾空白。</div></div>'+
    clearUI+
    '<div style="display:flex;margin-top:16px"><button class="btn primary" data-act="save-'+k+'" style="flex:1">保存到钥匙串</button></div>'+
    '</div></div>'+
    '<div class="win-foot">凭据与 pi 无关 · 仅存本机钥匙串<span class="sp"></span>'+
    '<button class="btn plain" data-act="back">完成</button></div>';
}

/* ===== C:分步向导 ===== */
function stepsHTML(k){
  var pend=pendingList();
  return '<div class="steps">'+ORD.map(function(x,i){
    var st=S.prov[x].st;
    var cls = st==='ok' ? 'done' : (x===k ? 'cur' : '');
    var mark = st==='ok' ? '✓' : (i+1);
    var dead = (st==='ok')? '' : (pend.indexOf(x)>=0?'':'');
    return '<div class="step '+cls+'"><span class="ring">'+mark+'</span><span class="sl">'+SHORT[x]+'</span></div>';
  }).join('')+'</div>';
}
function wizardHTML(){
  var k=S.focus; // firstPending guaranteed non-null in wizard
  var pr=S.prov[k];
  var pend=pendingList();
  var curIdx=ORD.indexOf(k);
  var ban = S.fromErr ? '<div class="banner arrive">该凭据已失效,重存即恢复</div>'
          : (S.lastErr ? '<div class="banner err">无法写入钥匙串(错误码 -34018)。请重试。</div>' : '');
  return '<div class="pop-head"><button class="ibtn" data-act="back" title="退出向导">✕</button>'+
    '<span class="t">配置凭据</span><span class="sp"></span>'+
    '<span class="caps">'+(pend.length)+' 家待配置</span></div>'+
    stepsHTML(k)+
    '<div style="padding:0 15px">'+ban+'</div>'+
    '<div class="wz-body"><div class="wz-title">'+NAMES[k]+'</div>'+
    '<div class="wz-sub">'+HINT[k]+';保存时自动去除首尾空白。值只写入本机钥匙串。</div>'+
    '<div class="wz-field"><div class="lbl">访问凭据</div>'+
    '<div class="inp"><span class="lock">🔒</span>'+
    '<input type="text" readonly value="'+(S.reveal[k]? pr.val : (pr.val? mask():''))+'" placeholder="'+PLACE[k]+'">'+
    '<button class="eye" data-act="reveal-'+k+'">'+(S.reveal[k]?'隐藏':'显示')+'</button></div></div>'+
    '<div class="wz-acts"><button class="btn primary" data-act="save-'+k+'">保存并继续</button>'+
    '<button class="btn plain" data-act="wiz-skip">跳过</button><span class="sp"></span>'+
    '<button class="btn danger" data-act="wiz-exit">退出向导</button></div></div>';
}
function wizardDoneHTML(){
  return '<div class="pop-head"><span class="t">配置完成</span></div>'+
    '<div class="wz-big"><div class="ck">✓</div><div class="tt">三家凭据已全部配置</div>'+
    '<div class="st">凭据已写入系统钥匙串。<br>之后凭据失效时,可随时从主界面失效提示重新进入。</div>'+
    '<button class="btn primary" data-act="back" style="margin-top:8px">完成</button></div>';
}

/* ===== C:状态管理页(⚙) ===== */
function manageHTML(){
  var ban = S.lastErr?'<div class="banner err">无法写入钥匙串(错误码 -34018)。请重试。</div>':'';
  var rows = ORD.map(function(k){
    var ok=S.prov[k].st==='ok'; var dotC=ok?'ok':(S.prov[k].st==='invalid'?'bad':'miss');
    var clearUI = S.clearing===k
      ? '<span class="confirm">清除?<button class="btn primary" data-act="cfm-clear-'+k+'">清除</button>'+
        '<button class="btn plain" data-act="cancel-clear">取消</button></span>'
      : '<button class="btn danger" data-act="clear-'+k+'"'+(S.prov[k].st==='missing'?' disabled':'')+'>清除</button>';
    return '<div class="mrow"><span class="dot '+dotC+'"></span><span class="nm">'+NAMES[k]+'</span>'+
      '<span class="st-txt'+(ok?'':' bad')+'">'+stTxt(k)+'</span><span class="sp"></span>'+
      '<button class="mini-btn'+(ok?'':' primary')+'" data-act="manage-'+k+'">'+(ok?'编辑':'去配置')+'</button>'+clearUI+'</div>';
  }).join('');
  return '<div class="pop-head"><button class="ibtn" data-act="back">‹</button>'+
    '<span class="t">凭据管理</span><span class="sp"></span></div>'+
    '<div style="padding:2px 13px 0">'+ban+'</div>'+
    '<div style="padding:6px 0 10px">'+rows+'</div>'+
    '<div class="pop-foot">未配置/失效时主界面顶部有配置横幅<span class="sp"></span></div>';
}

/* ===== 渲染调度 ===== */
function viewSurface(){  // 变体各自的「特征面」:切换布局时直达
  if (S.variant==='A'){ S.focus=S.focus||firstPending()||'glm'; return settingsA(); }
  if (S.variant==='B'){ S.focus=S.focus||firstPending()||'glm'; return null; } // window 单独渲染
  if (S.variant==='C'){
    var p=firstPending();
    if (p){ S.focus=p; return wizardHTML(); }
    return manageHTML();
  }
  return mainHTML();
}
function render(){
  var root;
  // S.view 语义:main | form(A) | win(B) | wiz(C) | manage(C)
  if (S.view==='main'){ root=mainHTML(); }
  else if (S.variant==='A'){ root=settingsA(); }
  else if (S.variant==='C' && S.view==='wiz'){ root = S.wizDone? wizardDoneHTML() : wizardHTML(); }
  else if (S.variant==='C'){ root=manageHTML(); }
  // B:window 单独处理
  var winOpen = (S.variant==='B' && S.view!=='main');
  document.getElementById('popAnchor').style.display = winOpen ? 'none':'block';
  var w=document.getElementById('win');
  w.style.display = winOpen?'flex':'none';
  if (root!==null && !winOpen){ document.getElementById('popover').innerHTML = root+'<div class="arrow"></div>'; }
  if (winOpen){ w.innerHTML = winHTML(); }
  var vi=VARIANTS.findIndex(function(v){return v[0]===S.variant;});
  document.getElementById('vlabel').textContent = S.variant+' · '+VARIANTS[vi][1];
  bind();
  renderGroups();
}
function bind(){
  document.querySelectorAll('#popover [data-act], #win [data-act]').forEach(function(el){
    el.onclick=function(e){ e.stopPropagation(); handle(el.getAttribute('data-act')); };
  });
}
function handle(act){
  var m;
  if (act==='back'){ S.view='main'; S.focus=null; S.fromErr=false; S.clearing=null; S.lastErr=null; S.wizDone=false; }
  else if (act==='gear'){ openManage(null); }
  else if ((m=act.match(/^goto-(glm|kimi|ds)$/))){ openManage(m[1]); }
  else if ((m=act.match(/^manage-(glm|kimi|ds)$/))){ openManage(m[1]); }
  else if (act==='start-wiz'){ S.view='wiz'; S.focus=firstPending(); S.fromErr=false; S.wizDone=false; }
  else if ((m=act.match(/^focus-(glm|kimi|ds)$/))){ S.focus=m[1]; S.lastErr=null; }
  else if ((m=act.match(/^reveal-(glm|kimi|ds)$/))){ S.reveal[m[1]]=!S.reveal[m[1]]; }
  else if ((m=act.match(/^save-(glm|kimi|ds)$/))){ doSave(m[1]); return; }
  else if ((m=act.match(/^clear-(glm|kimi|ds)$/))){ S.clearing=m[1]; }
  else if ((m=act.match(/^cfm-clear-(glm|kimi|ds)$/))){ S.prov[m[1]]={st:'missing',val:''}; S.clearing=null; S.savedTick[m[1]]=false; }
  else if (act==='cancel-clear'){ S.clearing=null; }
  else if (act==='wiz-skip'){ skipWiz(); return; }
  else if (act==='wiz-exit'){ S.view='main'; S.fromErr=false; S.lastErr=null; }
  else return;
  render();
}
function openManage(focus){
  if (S.variant==='A'){ S.view='form'; S.focus=focus||firstPending()||'glm'; S.fromErr=!!focus; S.lastErr=null; }
  else if (S.variant==='B'){ S.view='win'; S.focus=focus||'glm'; S.fromErr=!!focus; S.lastErr=null; }
  else { S.view = focus? 'wiz':'manage'; S.focus = focus||null;
    if (S.view==='wiz' && !S.focus) S.focus=firstPending(); S.fromErr=!!focus; S.wizDone=false; }
}
function doSave(k){
  if (S.simFail){ S.lastErr=true; S.savedTick[k]=false; render(); return; }
  S.prov[k]={st:'ok',val:S.prov[k].val||FAKE[k]};
  S.savedTick[k]=true; S.lastErr=null; S.clearing=null;
  toast('已保存到钥匙串:'+SHORT[k]);
  if (S.variant==='C' && S.view==='wiz'){
    var p=firstPending();
    if (p){ S.focus=p; S.wizDone=false; S.fromErr=false; }
    else { S.wizDone=true; }
  }
  render();
}
function skipWiz(){
  var p=firstPending(); // 跳过当前(S.focus),继续找下一个待配置
  var rest=pendingList().filter(function(k){ return k!==S.focus; });
  if (rest.length){ S.focus=rest[0]; S.fromErr=false; }
  else { S.view='main'; }
  render();
}

/* ===== 控制条 ===== */
function chipGroup(elId,items,curKey,fn){
  var el=document.getElementById(elId);
  el.innerHTML=items.map(function(it){
    return '<button class="chip'+(it[0]===curKey?' on':'')+'" data-k="'+it[0]+'">'+it[1]+'</button>';
  }).join('');
  el.querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){ fn(c.getAttribute('data-k')); };
  });
}
function renderGroups(){
  chipGroup('sceneGroup',SCENES,S.scene,function(k){
    S.scene=k; S.prov=initProv(k); S.view='main'; S.focus=null; S.reveal={}; S.clearing=null;
    S.lastErr=null; S.savedTick={}; S.wizDone=false; S.fromErr=false; render();
  });
  chipGroup('failGroup',[['ok','成功'],['fail','失败']],S.simFail?'fail':'ok',function(k){
    S.simFail=k==='fail'; S.lastErr=null; render();
  });
  chipGroup('themeGroup',[['light','浅色'],['dark','深色']],S.theme,function(k){
    S.theme=k; document.documentElement.className='theme-'+k; render();
  });
}
function switchVariant(dir){
  var i=VARIANTS.findIndex(function(v){return v[0]===S.variant;});
  S.variant=VARIANTS[(i+dir+VARIANTS.length)%VARIANTS.length][0];
  history.replaceState(null,'','?variant='+S.variant);
  S.focus=null; S.clearing=null; S.lastErr=null; S.fromErr=false; S.wizDone=false; S.savedTick={}; S.reveal={};
  // 直达特征面,让差异可见
  if (S.variant==='A'){ S.view='form'; S.focus=firstPending()||'glm'; }
  else if (S.variant==='B'){ S.view='win'; S.focus=firstPending()||'glm'; }
  else { S.view = firstPending()? 'wiz':'manage'; S.focus=firstPending()||null; }
  render();
}
document.querySelectorAll('[data-nav]').forEach(function(b){
  b.onclick=function(){ switchVariant(parseInt(b.getAttribute('data-nav'),10)); };
});
document.addEventListener('keydown',function(e){
  if (e.target.closest('button,input')) return;
  if (e.key==='ArrowLeft') switchVariant(-1);
  if (e.key==='ArrowRight') switchVariant(1);
});
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(function(){ t.style.display='none'; },1800);
}

/* ===== 启动:直达特征面 ===== */
S.prov=initProv(S.scene);
if (S.variant==='A'){ S.view='form'; S.focus=firstPending()||'glm'; }
else if (S.variant==='B'){ S.view='win'; S.focus=firstPending()||'glm'; }
else { S.view = firstPending()? 'wiz':'manage'; S.focus=firstPending()||null; }
render();
</script>
</body>
</html>
